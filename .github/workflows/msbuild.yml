name: Upload Unreal Build Artifacts (Windows, self-hosted)

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: "Name of the artifact to upload"
        required: true
        default: "windows-build"
      build_path:
        description: "Path to your prebuilt Windows package folder on the self-hosted runner"
        required: true
        default: "D:/repos/aura/Build"

jobs:
  upload:
    # This must match the labels of your Windows self-hosted runner
    runs-on: [self-hosted, windows]

    steps:
      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name }}
          path: ${{ github.event.inputs.build_path }}
          retention-days: 7