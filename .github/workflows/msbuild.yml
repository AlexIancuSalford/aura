name: Upload Unreal Build Artifacts (Windows)

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: "Name of the artifact to upload"
        required: true
        default: "${{ secrets.UE_ARTIFACT_NAME }}"
      build_path:
        description: "Path to your prebuilt Windows package folder"
        required: true
        default: "${{ secrets.UE_BUILD_PATH }}"

jobs:
  upload:
    runs-on: windows-latest

    steps:
      - name: Checkout Repo (workspace init)
        uses: actions/checkout@v4

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name }}
          path: ${{ github.event.inputs.build_path }}
          retention-days: 7